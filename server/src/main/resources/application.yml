spring:
  application:
    name: rag-agent-platform
  datasource:
    url: jdbc:mysql://localhost:3306/ragagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ragagent
    password: ragagent
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

app:
  jwt:
    access-token-secret: change-me-in-prod-32-chars-minimum-please-for-access
    refresh-token-secret: change-me-in-prod-32-chars-minimum-please-for-refresh
    access-token-validity-minutes: 60
    refresh-token-validity-days: 30

logging:
  level:
    io.kyligence.ragagent: INFO
