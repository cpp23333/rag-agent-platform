spring:
  application:
    name: rag-agent-platform
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ragagent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    postgres:
      url: jdbc:postgresql://localhost:5432/ragagent_vec
      username: ragagent
      password: ragagent
      driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

app:
  jwt:
    access-token-secret: change-me-in-prod-32-chars-minimum-please-for-access
    refresh-token-secret: change-me-in-prod-32-chars-minimum-please-for-refresh
    access-token-validity-minutes: 60
    refresh-token-validity-days: 30

ragagent:
  model-gateway:
    default-chat: openai/gpt-4o-mini
    fallback-chat: deepseek/deepseek-chat
    default-embedding: openai/text-embedding-3-small
    default-rerank: bge/bge-reranker-v2-m3
    retry-max-attempts: 3
    timeout-seconds: 120
    encryption-key: ${MODEL_GATEWAY_ENCRYPTION_KEY:change-me-in-prod-32-chars-min!}

logging:
  level:
    io.kyligence.ragagent: INFO
