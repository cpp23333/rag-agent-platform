databaseChangeLog:
  - changeSet:
      id: 001-workspace
      author: ragagent
      changes:
        - createTable:
            tableName: workspace
            columns:
              - column: { name: id,         type: VARCHAR(36),   constraints: { primaryKey: true, nullable: false } }
              - column: { name: name,       type: VARCHAR(128),  constraints: { nullable: false } }
              - column: { name: owner_id,   type: VARCHAR(36),   constraints: { nullable: false } }
              - column: { name: created_at, type: DATETIME,      defaultValueComputed: "CURRENT_TIMESTAMP", constraints: { nullable: false } }
              - column: { name: updated_at, type: DATETIME,      defaultValueComputed: "CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP", constraints: { nullable: false } }
              - column: { name: deleted,    type: TINYINT(1),    defaultValueNumeric: "0", constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: workspace
            columnNames: "owner_id, name"
            constraintName: uq_workspace_owner_name
        - createIndex:
            tableName: workspace
            indexName: idx_workspace_owner
            columns:
              - column: { name: owner_id }
